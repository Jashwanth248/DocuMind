<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect width="1440" height="820" fill="#0e1117"/><text x="58" y="60" font-size="30" font-family="Arial" font-weight="700" fill="#f3f4f6">DocuMind</text><text x="58" y="88" font-size="14" font-family="Arial" fill="#9ca3af">Multimodal knowledge assistant</text><rect x="30" y="120" width="300" height="640" rx="18" fill="#151a23" stroke="#2c3442"/><text x="54" y="160" font-size="20" font-family="Arial" font-weight="700" fill="#f3f4f6">Knowledge Library</text><rect x="54" y="198" width="252" height="46" rx="12" fill="#4f8cff"/><text x="105" y="228" font-size="16" font-family="Arial" font-weight="700" fill="white">+ Add files</text><text x="54" y="285" font-size="13" font-family="Arial" fill="#9ca3af">Indexed sources</text><text x="260" y="286" font-size="20" font-family="Arial" font-weight="700" fill="#f3f4f6">4</text><g font-family="Arial"><rect x="50" y="318" width="260" height="60" rx="10" fill="#1f2633"/><text x="64" y="343" font-size="14" font-weight="700" fill="#f3f4f6">research_report.pdf</text><text x="64" y="365" font-size="12" fill="#9ca3af">PDF · 24 pages</text><rect x="50" y="390" width="260" height="60" rx="10" fill="#1f2633"/><text x="64" y="415" font-size="14" font-weight="700" fill="#f3f4f6">meeting_audio.m4a</text><text x="64" y="437" font-size="12" fill="#9ca3af">Audio</text><rect x="50" y="462" width="260" height="60" rx="10" fill="#1f2633"/><text x="64" y="487" font-size="14" font-weight="700" fill="#f3f4f6">architecture.png</text><text x="64" y="509" font-size="12" fill="#9ca3af">Image</text><rect x="50" y="534" width="260" height="60" rx="10" fill="#1f2633"/><text x="64" y="559" font-size="14" font-weight="700" fill="#f3f4f6">product_demo.mp4</text><text x="64" y="581" font-size="12" fill="#9ca3af">Video</text></g><rect x="365" y="120" width="1040" height="640" rx="18" fill="#151a23" stroke="#2c3442"/><text x="400" y="160" font-size="18" font-family="Arial" font-weight="700" fill="#f3f4f6">Conversation</text><text x="400" y="190" font-size="13" font-family="Arial" fill="#9ca3af">Answers are grounded in the files you indexed.</text><rect x="730" y="245" width="620" height="83" rx="18" fill="#243247"/><text x="760" y="282" font-size="16" font-family="Arial" fill="#f3f4f6">What were the main decisions about the product launch?</text><rect x="405" y="365" width="820" height="155" rx="18" fill="#1f2633"/><text x="435" y="400" font-size="16" font-family="Arial" fill="#f3f4f6">The launch was moved to the second half of October.</text><text x="435" y="430" font-size="16" font-family="Arial" fill="#f3f4f6">The team also agreed to finish the mobile onboarding flow</text><text x="435" y="460" font-size="16" font-family="Arial" fill="#f3f4f6">before release and keep the first rollout limited to pilot customers.</text><text x="435" y="555" font-size="14" font-family="Arial" font-weight="700" fill="#f3f4f6">Sources used</text><rect x="435" y="585" width="325" height="53" rx="12" fill="#0e1117" stroke="#2c3442"/><text x="452" y="617" font-size="13" font-family="Arial" fill="#f3f4f6">meeting_audio.m4a · 12:40–13:28</text><rect x="780" y="585" width="320" height="53" rx="12" fill="#0e1117" stroke="#2c3442"/><text x="797" y="617" font-size="13" font-family="Arial" fill="#f3f4f6">research_report.pdf · page 8</text><rect x="405" y="680" width="955" height="53" rx="16" fill="#0e1117" stroke="#2c3442"/><text x="430" y="712" font-size="14" font-family="Arial" fill="#9ca3af">Ask anything about the files you added...</text></svg>