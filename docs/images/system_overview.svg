<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" rx="28" fill="#0b1020"/><text x="60" y="58" fill="#f8fafc" font-family="Arial" font-size="30" font-weight="700">DocuMind — Multimodal Knowledge Pipeline</text><text x="60" y="88" fill="#94a3b8" font-family="Arial" font-size="15">Documents, images, audio and video become one searchable private knowledge space</text><g font-family="Arial"><rect x="55" y="145" width="185" height="115" rx="18" fill="#151c31" stroke="#334155"/><text x="78" y="183" fill="#e2e8f0" font-size="18" font-weight="700">Knowledge inputs</text><text x="78" y="213" fill="#94a3b8" font-size="13">PDF · DOCX · PPTX · XLSX</text><text x="78" y="236" fill="#94a3b8" font-size="13">images · audio · video · text</text><line x1="240" y1="202" x2="310" y2="202" stroke="#60a5fa" stroke-width="4"/><polygon points="310,202 296,194 296,210" fill="#60a5fa"/><rect x="310" y="145" width="210" height="115" rx="18" fill="#151c31" stroke="#334155"/><text x="333" y="183" fill="#e2e8f0" font-size="18" font-weight="700">Multimodal ingestion</text><text x="333" y="213" fill="#94a3b8" font-size="13">local parsers + Gemini</text><text x="333" y="236" fill="#94a3b8" font-size="13">normalize + preserve sources</text><line x1="520" y1="202" x2="590" y2="202" stroke="#60a5fa" stroke-width="4"/><polygon points="590,202 576,194 576,210" fill="#60a5fa"/><rect x="590" y="145" width="210" height="115" rx="18" fill="#151c31" stroke="#334155"/><text x="613" y="183" fill="#e2e8f0" font-size="18" font-weight="700">Semantic index</text><text x="613" y="213" fill="#94a3b8" font-size="13">chunking + embeddings</text><text x="613" y="236" fill="#94a3b8" font-size="13">persistent Chroma vector store</text><line x1="800" y1="202" x2="870" y2="202" stroke="#60a5fa" stroke-width="4"/><polygon points="870,202 856,194 856,210" fill="#60a5fa"/><rect x="870" y="145" width="270" height="115" rx="18" fill="#151c31" stroke="#334155"/><text x="893" y="183" fill="#e2e8f0" font-size="18" font-weight="700">Grounded conversation</text><text x="893" y="213" fill="#94a3b8" font-size="13">top-K retrieval + source labels</text><text x="893" y="236" fill="#94a3b8" font-size="13">Gemini answer + citations</text><rect x="55" y="330" width="1085" height="150" rx="22" fill="#10182b" stroke="#24324a"/><text x="80" y="370" fill="#f8fafc" font-size="18" font-weight="700">Three ways to keep the knowledge base current</text><rect x="82" y="394" width="285" height="58" rx="14" fill="#172036"/><text x="105" y="429" fill="#93c5fd" font-size="15" font-weight="700">Chat UI uploads</text><rect x="455" y="394" width="285" height="58" rx="14" fill="#172036"/><text x="478" y="429" fill="#93c5fd" font-size="15" font-weight="700">FastAPI /ingest</text><rect x="828" y="394" width="285" height="58" rx="14" fill="#172036"/><text x="851" y="429" fill="#93c5fd" font-size="15" font-weight="700">Watched folder</text></g></svg>